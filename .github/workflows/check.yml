name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run verify
        working-directory: web
  plugin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: plugin/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-ui.cjs
        working-directory: plugin
      - run: sh tools/build-plugin.sh
  freetier-plugin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - run: sh tools/build-freetier-plugin.sh
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s insights -p 'test_*.py'
      - run: python tools/review-public.py
